<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Workspace · Responsive QA</title>
<style>body{margin:0;background:#e8e7eb;font:13px system-ui;color:#443b4c}header{height:52px;padding:0 22px;display:flex;align-items:center;gap:15px;background:white;border-bottom:1px solid #d9d5df;position:sticky;top:0}button{font:inherit;padding:5px 11px;background:#f3eff8;border:1px solid #d9cfe5;border-radius:5px;color:#735c8c;cursor:pointer}main{padding:22px;display:flex;justify-content:center;overflow:auto}iframe{border:1px solid #ccc5d6;border-radius:8px;background:white;box-shadow:0 10px 40px #3f314518;width:390px;height:844px;flex:none}span{margin-left:auto;font-size:11px;color:#998da5}</style>
<header><strong>响应式实测</strong><button data-width="390" data-height="844">390 · 手机</button><button data-width="768" data-height="1024">768 · 平板</button><button data-width="1280" data-height="900">1280 · 桌面</button><span>真实 iframe 视口 · 与原型共享浏览器状态</span></header><main><iframe title="响应式原型" src="/" width="390" height="844"></iframe></main>
<script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{let f=document.querySelector('iframe');f.style.width=b.dataset.width+'px';f.style.height=b.dataset.height+'px';f.width=b.dataset.width;f.height=b.dataset.height;});</script></html>
